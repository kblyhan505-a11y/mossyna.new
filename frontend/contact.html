<!-- ============ PAGE HEADER ============ -->

<!-- ============ CONTACT LAYOUT ============ -->
<section class="container section">
  <div class="checkout-layout">

    <!-- ============ LEFT: FORM ============ -->
    <div>
      <div class="checkout-card" id="contactFormCard">
        <h3 data-i18n="contact.form.title"></h3>

        <div id="contactErrorBanner" class="hidden" style="background:#fdecea; border:1px solid var(--danger); color:var(--danger); border-radius:var(--radius-md); padding:12px 16px; margin-bottom:20px; font-size:.9rem;"></div>

        <form id="contactForm" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label data-i18n="contact.name"></label>
              <input type="text" id="contactName" required>
              <div class="field-error"></div>
            </div>
            <div class="form-group">
              <label data-i18n="auth.email"></label>
              <input type="email" id="contactEmail" required autocomplete="email">
              <div class="field-error"></div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label data-i18n="contact.phone"></label>
              <input type="tel" id="contactPhone" placeholder="+90 5xx xxx xx xx">
            </div>
            <div class="form-group">
              <label data-i18n="contact.subject"></label>
              <input type="text" id="contactSubject">
            </div>
          </div>
          <div class="form-group">
            <label data-i18n="contact.message"></label>
            <textarea rows="5" id="contactMessage" required></textarea>
            <div class="field-error"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="contactSubmitBtn" data-i18n="contact.sendbtn"></button>
        </form>
      </div>

      <!-- ============ SUCCESS PANEL ============ -->
      <div class="checkout-card hidden" id="contactSuccessPanel" style="text-align:center;">
        <div style="font-size:2.4rem; margin-bottom:8px;">✅</div>
        <h3 data-i18n="contact.success.title"></h3>
        <p class="form-hint" data-i18n="contact.success.desc"></p>
      </div>
    </div>

    <!-- ============ RIGHT: CONTACT INFO ============ -->
    <div class="order-summary">
      <h3 data-i18n="contact.info.title"></h3>
      <div class="summary-line"><span>📧</span><span>info@mossyna.com</span></div>
      <div class="summary-line"><span>📞</span><span>+90 212 000 00 00</span></div>
      <div class="summary-line"><span>📍</span><span data-i18n="contact.info.address"></span></div>
    </div>

  </div>
</section>

<script>
  /* ---------- İletişim Formu: POST /api/contact ---------- */
  function mossynaShowContactError(message) {
    const banner = document.getElementById("contactErrorBanner");
    banner.textContent = message;
    banner.classList.remove("hidden");
  }

  function mossynaHideContactError() {
    document.getElementById("contactErrorBanner").classList.add("hidden");
  }

  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("contactForm");
    if (!form) return;

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      mossynaHideContactError();

      const nameInput = document.getElementById("contactName");
      const emailInput = document.getElementById("contactEmail");
      const messageInput = document.getElementById("contactMessage");

      [nameInput, emailInput, messageInput].forEach(mossynaClearFieldError);

      let valid = true;
      if (!nameInput.value.trim()) {
        mossynaSetFieldError(nameInput, mossynaT("auth.error.required"));
        valid = false;
      }
      if (!emailInput.value.trim() || !mossynaIsValidEmail(emailInput.value.trim())) {
        mossynaSetFieldError(emailInput, mossynaT("auth.error.email"));
        valid = false;
      }
      if (!messageInput.value.trim()) {
        mossynaSetFieldError(messageInput, mossynaT("contact.error.message"));
        valid = false;
      }
      if (!valid) return;

      const payload = {
        name: nameInput.value.trim(),
        email: emailInput.value.trim(),
        phone: document.getElementById("contactPhone").value.trim() || null,
        subject: document.getElementById("contactSubject").value.trim() || null,
        message: messageInput.value.trim(),
      };

      const submitBtn = document.getElementById("contactSubmitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = mossynaT("contact.sending");

      try {
        await mossynaApi.post("/api/contact", payload);
        document.getElementById("contactFormCard").classList.add("hidden");
        document.getElementById("contactSuccessPanel").classList.remove("hidden");
      } catch (err) {
        mossynaShowContactError(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = mossynaT("contact.sendbtn");
      }
    });
  });
</script>
