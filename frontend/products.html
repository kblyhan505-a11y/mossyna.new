<script>
  /* ---------- Ürünler Sayfası: Filtreleme + Sıralama ---------- */
  function mossynaGetQueryParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  async function mossynaRenderProductGrid() {
    const grid = document.querySelector("[data-product-grid]");
    if (!grid) return;

    const catFilter = document.querySelector('input[name="cat"]:checked')?.value || "all";
    const priceFilter = document.querySelector('input[name="price"]:checked')?.value || "all";
    const sort = document.getElementById("sortSelect")?.value || "featured";

    grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:var(--text-muted);">Ürünler yükleniyor…</p>`;

    const filters = { pageSize: 100 };
    if (catFilter !== "all") filters.category = catFilter;
    if (priceFilter !== "all") {
      const [min, max] = priceFilter.split("-").map(Number);
      filters.minPrice = min;
      filters.maxPrice = max;
    }
    if (sort === "priceAsc" || sort === "priceDesc") filters.sort = sort;

    let list = [];
    try {
      list = await mossynaFetchProducts(filters);
    } catch (err) {
      list = [];
    }
    // Backend'e ulaşılamazsa ya da sonuç boşsa (bkz. js/mock-data.js), vitrin
    // boş görünmesin diye örnek ürünlere aynı filtrelerle geçilir.
    if (!list.length && typeof mossynaGetMockProducts === "function") {
      list = mossynaGetMockProducts(filters);
    }
    grid.innerHTML = list.map(mossynaProductCardHTML).join("") ||
      `<p style="grid-column:1/-1; text-align:center; color:var(--text-muted);">Ürün bulunamadı.</p>`;
    document.querySelector("[data-result-count]").textContent = list.length;
  }

  document.addEventListener("DOMContentLoaded", () => {
    const initialCat = mossynaGetQueryParam("category");
    if (initialCat) {
      const radio = document.querySelector(`input[name="cat"][value="${initialCat}"]`);
      if (radio) radio.checked = true;
    }
    mossynaRenderProductGrid();

    document.querySelectorAll('input[name="cat"], input[name="price"]').forEach(el =>
      el.addEventListener("change", mossynaRenderProductGrid)
    );
    document.getElementById("sortSelect").addEventListener("change", mossynaRenderProductGrid);
  });
</script>
